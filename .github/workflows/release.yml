name: Signed Windows release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install minisign
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'minisign-0.12-win64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'minisign-0.12'
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479'
          if ($actual -ne $expected) {
            throw "minisign archive SHA-256 mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $bin = Join-Path $destination 'minisign-win64\x86_64'
          [IO.File]::AppendAllText(
            $env:GITHUB_PATH,
            "$bin`n",
            [Text.UTF8Encoding]::new($false)
          )
          & (Join-Path $bin 'minisign.exe') -v

      - name: Build, test, sign, and publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          MINISIGN_SECRET_KEY_BASE64: ${{ secrets.MINISIGN_SECRET_KEY_BASE64 }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          LAUNCHER_RELEASE_API_TOKEN: ${{ secrets.LAUNCHER_RELEASE_API_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          ./scripts/release.ps1 -Version $Matches[1] -Publish
