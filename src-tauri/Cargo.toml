[package]
name = "zhekarikstrike_launcher"
version = "1.6.18"
description = "ZHEKARIK STRIKE Launcher"
authors = ["d3affy"]
edition = "2021"

[lib]
name = "zhekarikstrike_launcher_lib"
# This launcher only targets Windows desktop. Mobile Tauri builds need the
# staticlib/cdylib outputs; desktop links the library through the rlib.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
portable = []
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
content-pack-core = { path = "crates/content-pack-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["stream", "json", "native-tls-alpn"] }
futures-util = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"

thiserror = "2"
anyhow = "1"

zip = "2"
zstd = "0.13"
walkdir = "2"
fs_extra = "1"

sha2 = "0.10"
hex = "0.4"

sysinfo = "0.33"
directories = "6"
sys-locale = "0.3"

uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
semver = "1"

windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security_WinTrust",
  "Win32_Security_Cryptography"
] }

discord-rich-presence = "0.2"
minisign-verify = "0.2"

[dev-dependencies]
tempfile = "3"
h2 = "0.4"
http = "1"
bytes = "1"

# Generated Win32 bindings can exhaust the pagefile when LLVM optimizes their
# full release surface at level 3. They are thin FFI wrappers, so a smaller
# optimization level has negligible runtime impact while keeping release builds
# reliable on the supported 16 GB Windows builder.
[profile.release.package.windows]
opt-level = 1
codegen-units = 64

# The launcher crate contains all Tauri command glue in one large library and
# can hit the LLVM memory ceiling even at level 1. CPU-heavy hashing,
# compression and HTTP work stays release-optimized in dependencies.
[profile.release.package.zhekarikstrike_launcher]
opt-level = 0
codegen-units = 16

[workspace]
members = ["crates/content-pack-core"]
resolver = "2"

[profile.release.package.content-pack-core]
opt-level = 3
codegen-units = 16
