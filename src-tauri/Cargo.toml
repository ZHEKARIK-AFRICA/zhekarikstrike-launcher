[package]
name = "zhekarikstrike_launcher"
version = "1.6.3"
description = "ZHEKARIK STRIKE Launcher"
authors = ["d3affy"]
edition = "2021"

[lib]
name = "zhekarikstrike_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
portable = []
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

thiserror = "2"
anyhow = "1"

zip = "2"
walkdir = "2"
fs_extra = "1"

sha2 = "0.10"
hex = "0.4"

sysinfo = "0.33"
directories = "6"
sys-locale = "0.3"

uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
semver = "1"

windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp"
] }

discord-rich-presence = "0.2"
minisign-verify = "0.2"

[dev-dependencies]
tempfile = "3"
